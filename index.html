<!DOCTYPE html>
<html>
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pantry Check - Categories</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}
body{margin:0;padding:12px 12px 100px;background:#f6f6f6}
h1{font-size:26px;margin:0}
.sub{color:#666;font-size:13px;margin:2px 0 10px}
.search{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:12px;font-size:16px;margin:8px 0;background:#fff}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{flex:1;padding:10px;border:0;border-radius:10px;font-weight:700;font-size:14px;background:#e9e9e9}
.tab.active{background:#111;color:#fff}
.stats{display:flex;gap:12px;margin:6px 0 10px;color:#666;font-size:12px;font-weight:600}
.cat-bar{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-chip{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1.5px solid #ddd;background:#fff;font-size:13px;font-weight:600}
.cat-chip.active{background:#111;color:#fff;border-color:#111}
.cat-section{margin:18px 0 0}
.cat-head{display:flex;align-items:center;gap:8px;padding:8px 2px}
.cat-title{font-weight:800;font-size:17px;flex:1}
.cat-count{font-size:12px;color:#777;background:#eee;padding:3px 8px;border-radius:20px}
.cat-actions{display:flex;gap:6px}
.cat-actions button{border:0;background:#fff;border:1px solid #ddd;border-radius:8px;padding:5px 8px;font-size:11px}
.item{display:flex;align-items:center;gap:12px;background:#fff;padding:14px 12px;border-radius:14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,0.06)}
.item.out{opacity:0.6}
.cb{width:28px;height:28px;accent-color:#111;flex-shrink:0}
.name{flex:1;font-size:17px;font-weight:700;color:#111;min-width:0;word-break:break-word;line-height:1.2}
.pills{display:flex;gap:6px;flex-shrink:0}
.pill{font-size:18px;line-height:1;padding:8px 2px;border-radius:10px;border:1.5px solid #e5e5e5;background:#f7f7f7;width:42px;height:38px;display:flex;align-items:center;justify-content:center;text-align:center}
.pill.on{background:#111;color:#fff;border-color:#111;transform:scale(1.05)}
.del{color:#bbb;border:0;background:none;font-size:20px;padding:0 4px}
.add-box{background:#fff;border-radius:14px;padding:12px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.add-row{display:flex;gap:8px;margin-bottom:8px}
.add-row input{flex:1;padding:12px;border:2px solid #e5e5e5;border-radius:10px;font-size:16px}
.add-row select{padding:12px;border:2px solid #e5e5e5;border-radius:10px;font-size:14px;background:#fff;max-width:130px}
.add-row button{padding:12px 18px;background:#111;color:#fff;border:0;border-radius:10px;font-weight:700}
.add-loc{display:flex;gap:6px;align-items:center;font-size:12px;color:#666}
.add-loc label{display:flex;align-items:center;gap:3px;font-size:12px}
.edit-cat-row{display:flex;gap:6px;margin:10px 0}
.edit-cat-row input{flex:1;padding:10px;border:2px solid #e5e5e5;border-radius:10px}
.edit-cat-row button{padding:10px 14px;border-radius:10px;border:0;font-weight:600}
.btn-dark{background:#111;color:#fff}
.btn-light{background:#eee}
</style>
</head>
<body>
<h1>Pantry Check</h1>
<p class="sub">Categories editable • Check = in stock • Uncheck = grocery list</p>
<input id="search" class="search" placeholder="Search items or categories..." oninput="render()">

<div class="tabs">
<button id="tabAll" class="tab active" onclick="setTab('all')">All Items</button>
<button id="tabGroc" class="tab" onclick="setTab('groc')">Grocery List</button>
<button id="tabCat" class="tab" onclick="setTab('cat')">Edit Categories</button>
</div>
<div class="stats"><span id="inCount"></span><span id="outCount"></span></div>

<div id="catBar" class="cat-bar"></div>

<div class="add-box">
<div class="add-row">
<input id="newItem" placeholder="Add item e.g. Steak" onkeydown="if(event.key==='Enter')add()">
<select id="newCat"></select>
<button onclick="add()">Add</button>
</div>
<div class="add-loc">
<span>Store in:</span>
<label><input type="checkbox" id="locFreezer"> ❄️</label>
<label><input type="checkbox" id="locFridge" checked> 🧊</label>
<label><input type="checkbox" id="locPantry"> 🥫</label>
</div>
</div>

<div id="catEdit" style="display:none">
<div class="edit-cat-row">
<input id="newCatName" placeholder="New category e.g. Spices">
<button class="btn-dark" onclick="addCategory()">Add Category</button>
</div>
<div id="catListEdit"></div>
</div>

<div id="list"></div>

<script>
let categories=["Meats","Vegetables","Fruits","Dairy","Condiments","Bakery","Pantry","Frozen","Beverages","Snacks"];
let tab='all';
let filterCat='';
let items=[
{n:"Chicken Breast",cat:"Meats",loc:["freezer","fridge"],in:false},
{n:"Ground Beef",cat:"Meats",loc:["freezer"],in:false},
{n:"Bacon",cat:"Meats",loc:["fridge","freezer"],in:true},
{n:"Steak",cat:"Meats",loc:["freezer"],in:false},
{n:"Deli Turkey",cat:"Meats",loc:["fridge"],in:false},
{n:"Ham",cat:"Meats",loc:["fridge"],in:true},
{n:"Broccoli",cat:"Vegetables",loc:["fridge","freezer"],in:true},
{n:"Carrots",cat:"Vegetables",loc:["fridge"],in:true},
{n:"Lettuce",cat:"Vegetables",loc:["fridge"],in:true},
{n:"Spinach",cat:"Vegetables",loc:["fridge","freezer"],in:false},
{n:"Kale",cat:"Vegetables",loc:["fridge"],in:false},
{n:"Onions",cat:"Vegetables",loc:["pantry"],in:true},
{n:"Garlic",cat:"Vegetables",loc:["pantry"],in:true},
{n:"Tomatoes",cat:"Vegetables",loc:["fridge"],in:true},
{n:"Zucchini",cat:"Vegetables",loc:["fridge"],in:false},
{n:"Potatoes",cat:"Vegetables",loc:["pantry"],in:true},
{n:"Mushrooms",cat:"Vegetables",loc:["fridge"],in:false},
{n:"Apples",cat:"Fruits",loc:["fridge"],in:true},
{n:"Bananas",cat:"Fruits",loc:["pantry"],in:true},
{n:"Blueberries",cat:"Fruits",loc:["fridge"],in:true},
{n:"Grapes",cat:"Fruits",loc:["fridge"],in:false},
{n:"Oranges",cat:"Fruits",loc:["pantry"],in:false},
{n:"Strawberries",cat:"Fruits",loc:["fridge"],in:true},
{n:"Avocados",cat:"Fruits",loc:["pantry"],in:false},
{n:"Milk",cat:"Dairy",loc:["fridge"],in:false},
{n:"Cheese",cat:"Dairy",loc:["fridge"],in:true},
{n:"Butter",cat:"Dairy",loc:["fridge"],in:true},
{n:"Yogurt",cat:"Dairy",loc:["fridge"],in:true},
{n:"Greek Yogurt",cat:"Dairy",loc:["fridge"],in:true},
{n:"Eggs",cat:"Dairy",loc:["fridge"],in:true},
{n:"Almond Milk",cat:"Dairy",loc:["fridge"],in:true},
{n:"Ketchup",cat:"Condiments",loc:["fridge"],in:true},
{n:"Mayo",cat:"Condiments",loc:["fridge"],in:true},
{n:"Mustard",cat:"Condiments",loc:["fridge"],in:true},
{n:"Salsa",cat:"Condiments",loc:["fridge"],in:true},
{n:"Olive Oil",cat:"Condiments",loc:["pantry"],in:true},
{n:"Ranch",cat:"Condiments",loc:["fridge"],in:false},
{n:"Peanut Butter",cat:"Condiments",loc:["pantry"],in:true},
{n:"Honey",cat:"Condiments",loc:["pantry"],in:true},
{n:"Jam",cat:"Condiments",loc:["fridge"],in:true},
{n:"Bread",cat:"Bakery",loc:["pantry","freezer"],in:false},
{n:"Tortillas",cat:"Bakery",loc:["pantry"],in:false},
{n:"Bagels",cat:"Bakery",loc:["pantry","freezer"],in:true},
{n:"Flour",cat:"Pantry",loc:["pantry"],in:true},
{n:"Rice",cat:"Pantry",loc:["pantry"],in:true},
{n:"Pasta",cat:"Pantry",loc:["pantry"],in:true},
{n:"Cereal",cat:"Pantry",loc:["pantry"],in:false},
{n:"Oats",cat:"Pantry",loc:["pantry"],in:true},
{n:"Sugar",cat:"Pantry",loc:["pantry"],in:true},
{n:"Salt",cat:"Pantry",loc:["pantry"],in:true},
{n:"Coffee",cat:"Pantry",loc:["pantry"],in:true},
{n:"Quinoa",cat:"Pantry",loc:["pantry"],in:true},
{n:"Noodles",cat:"Pantry",loc:["pantry"],in:true},
{n:"Nuts",cat:"Pantry",loc:["pantry"],in:true},
{n:"Pizza",cat:"Frozen",loc:["freezer"],in:false},
{n:"Ice Cream",cat:"Frozen",loc:["freezer"],in:false},
{n:"Frozen Peas",cat:"Frozen",loc:["freezer"],in:true},
{n:"Fish Fillets",cat:"Frozen",loc:["freezer"],in:false},
{n:"Waffles",cat:"Frozen",loc:["freezer"],in:false},
{n:"Lasagna",cat:"Frozen",loc:["freezer"],in:false},
{n:"Vegetables Mix",cat:"Frozen",loc:["freezer"],in:true},
{n:"Juice",cat:"Beverages",loc:["fridge"],in:false},
{n:"Water",cat:"Beverages",loc:["pantry"],in:true},
{n:"Soda",cat:"Beverages",loc:["pantry","fridge"],in:true},
{n:"Chips",cat:"Snacks",loc:["pantry"],in:false},
{n:"Popcorn",cat:"Snacks",loc:["pantry"],in:true},
{n:"Crackers",cat:"Snacks",loc:["pantry"],in:true}
];

try{
 let s=localStorage.getItem('pantryCat_v2');
 if(s){let o=JSON.parse(s); items=o.items||items; categories=o.categories||categories;}
}catch(e){}

function save(){try{localStorage.setItem('pantryCat_v2',JSON.stringify({items,categories}))}catch(e){}}

function setTab(t){
 tab=t;
 document.getElementById('tabAll').className='tab'+(t==='all'?' active':'');
 document.getElementById('tabGroc').className='tab'+(t==='groc'?' active':'');
 document.getElementById('tabCat').className='tab'+(t==='cat'?' active':'');
 document.getElementById('catEdit').style.display=t==='cat'?'block':'none';
 document.getElementById('catBar').style.display=t==='cat'?'none':'flex';
 render();
}

function populateCatSelect(){
 let sel=document.getElementById('newCat');
 sel.innerHTML='';
 categories.forEach(c=>{
  let o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);
 });
}

function add(){
 let v=document.getElementById('newItem').value.trim();
 if(!v)return;
 let cat=document.getElementById('newCat').value||categories[0];
 let loc=[];
 if(document.getElementById('locFreezer').checked)loc.push('freezer');
 if(document.getElementById('locFridge').checked)loc.push('fridge');
 if(document.getElementById('locPantry').checked)loc.push('pantry');
 if(loc.length===0)loc=['pantry'];
 items.push({n:v,cat:cat,loc:loc,in:false});
 document.getElementById('newItem').value='';
 save(); render();
}

function addCategory(){
 let v=document.getElementById('newCatName').value.trim();
 if(!v)return;
 if(categories.includes(v)){alert('Category exists');return;}
 categories.push(v);
 document.getElementById('newCatName').value='';
 save(); populateCatSelect(); render();
}

function renameCategory(oldName){
 let nv=prompt('Rename "'+oldName+'" to:',oldName);
 if(!nv)return;
 nv=nv.trim();
 if(!nv||categories.includes(nv))return;
 categories=categories.map(c=>c===oldName?nv:c);
 items.forEach(it=>{if(it.cat===oldName)it.cat=nv});
 save(); populateCatSelect(); render();
}

function deleteCategory(name){
 if(!confirm('Delete category "'+name+'"? Items will move to "Pantry".'))return;
 categories=categories.filter(c=>c!==name);
 items.forEach(it=>{if(it.cat===name)it.cat='Pantry'});
 if(!categories.includes('Pantry'))categories.push('Pantry');
 save(); populateCatSelect(); render();
}

function toggle(i){items[i].in=!items[i].in; save(); render();}
function toggleLoc(i,loc){
 let a=items[i].loc;
 if(a.includes(loc))items[i].loc=a.filter(x=>x!==loc); else items[i].loc.push(loc);
 save(); render();
}
function del(i){if(confirm('Delete '+items[i].n+'?')){items.splice(i,1); save(); render();}}
function setFilterCat(c){filterCat=filterCat===c?'':c; render();}

function render(){
 populateCatSelect();
 let q=document.getElementById('search').value.toLowerCase();
 let filtered=items.map((it,idx)=>({...it,idx})).filter(it=>it.n.toLowerCase().includes(q)||it.cat.toLowerCase().includes(q));
 if(tab==='groc') filtered=filtered.filter(it=>!it.in);
 if(filterCat) filtered=filtered.filter(it=>it.cat===filterCat);

 document.getElementById('inCount').textContent=items.filter(i=>i.in).length+' in stock';
 document.getElementById('outCount').textContent=items.filter(i=>!i.in).length+' grocery list';

 // cat bar
 let bar=document.getElementById('catBar');
 bar.innerHTML='';
 let allBtn=document.createElement('button'); allBtn.className='cat-chip'+(filterCat===''?' active':''); allBtn.textContent='All'; allBtn.onclick=()=>setFilterCat(''); bar.appendChild(allBtn);
 categories.forEach(c=>{
  let b=document.createElement('button'); b.className='cat-chip'+(filterCat===c?' active':''); b.textContent=c; b.onclick=()=>setFilterCat(c); bar.appendChild(b);
 });

 // cat edit
 if(tab==='cat'){
  let edit=document.getElementById('catListEdit');
  edit.innerHTML='';
  categories.forEach(c=>{
   let row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:8px;background:#fff;padding:10px;border-radius:10px;margin-bottom:6px';
   let name=document.createElement('div'); name.style.flex='1'; name.style.fontWeight='600'; name.textContent=c+' ('+items.filter(i=>i.cat===c).length+')';
   let rn=document.createElement('button'); rn.className='btn-light'; rn.textContent='Rename'; rn.onclick=()=>renameCategory(c);
   let delBtn=document.createElement('button'); delBtn.className='btn-light'; delBtn.textContent='Delete'; delBtn.onclick=()=>deleteCategory(c);
   row.appendChild(name); row.appendChild(rn); row.appendChild(delBtn);
   edit.appendChild(row);
  });
 }

 // list
 let list=document.getElementById('list');
 list.innerHTML='';
 if(tab==='cat'){list.innerHTML='<p style="color:#777;text-align:center;margin-top:20px">Edit categories above. Tap Rename or Delete. New items will use these categories.</p>'; return;}

 let groups={};
 filtered.forEach(it=>{
  if(!groups[it.cat])groups[it.cat]=[];
  groups[it.cat].push(it);
 });

 let orderedCats=categories.filter(c=>groups[c]);
 // add any cats not in list (from search) 
 Object.keys(groups).forEach(c=>{if(!orderedCats.includes(c))orderedCats.push(c)});

 orderedCats.forEach(catName=>{
  let sec=document.createElement('div'); sec.className='cat-section';
  let head=document.createElement('div'); head.className='cat-head';
  let title=document.createElement('div'); title.className='cat-title'; title.textContent=catName;
  let count=document.createElement('div'); count.className='cat-count'; count.textContent=groups[catName].length;
  head.appendChild(title); head.appendChild(count);
  sec.appendChild(head);
  groups[catName].sort((a,b)=>a.n.localeCompare(b.n)).forEach(it=>{
   let row=document.createElement('div'); row.className='item'+(it.in?'':' out');
   let cb=document.createElement('input'); cb.type='checkbox'; cb.className='cb'; cb.checked=it.in; cb.onchange=()=>toggle(it.idx);
   let name=document.createElement('div'); name.className='name'; name.textContent=it.n;
   // inline cat change on tap name? double click to edit category
   name.ondblclick=()=>{
    let nc=prompt('Move "'+it.n+'" to category:',it.cat);
    if(nc&&categories.includes(nc)){items[it.idx].cat=nc; save(); render();}
    else if(nc&&nc.trim()&&!categories.includes(nc.trim())){
      if(confirm('Create new category "'+nc.trim()+'"?')){categories.push(nc.trim()); items[it.idx].cat=nc.trim(); save(); populateCatSelect(); render();}
    }
   };
   let pills=document.createElement('div'); pills.className='pills';
   [{k:'freezer',s:'❄️'},{k:'fridge',s:'🧊'},{k:'pantry',s:'🥫'}].forEach(o=>{
    let p=document.createElement('button'); p.className='pill'+(it.loc.includes(o.k)?' on':''); p.textContent=o.s; p.title=o.k; p.onclick=()=>toggleLoc(it.idx,o.k); pills.appendChild(p);
   });
   let d=document.createElement('button'); d.className='del'; d.textContent='×'; d.onclick=()=>del(it.idx);
   row.appendChild(cb); row.appendChild(name); row.appendChild(pills); row.appendChild(d);
   sec.appendChild(row);
  });
  list.appendChild(sec);
 });

 if(filtered.length===0){list.innerHTML='<p style="text-align:center;color:#999;margin-top:40px">No items. Add some above or clear filters.</p>'}
}
render();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
